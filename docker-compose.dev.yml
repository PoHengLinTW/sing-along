# Local dev stack: Postgres + an S3-compatible store (stand-in for Cloudflare R2).
# Postgres host port is 5433 so it doesn't collide with other local Postgres instances.
name: sing-along-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: singalong
      POSTGRES_PASSWORD: singalong
      POSTGRES_DB: singalong
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U singalong']
      interval: 2s
      timeout: 3s
      retries: 20

  # S3-compatible stand-in for Cloudflare R2. MinIO's official images are no longer published,
  # so we use RustFS (verified: presigned PUT enforces Content-Length/Content-Type, HEAD, CORS).
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      # The browser PUTs/GETs audio directly, from the Vite dev origin.
      RUSTFS_CORS_ALLOWED_ORIGINS: '*'
    ports:
      - '9000:9000'
    volumes:
      - s3data:/data

  # One-shot: creates the bucket (idempotent, retries until the store is up), then exits.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: auto
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        aws --endpoint-url http://s3:9000 s3api head-bucket --bucket sing-along 2>/dev/null && exit 0;
        aws --endpoint-url http://s3:9000 s3api create-bucket --bucket sing-along 2>/dev/null && exit 0;
        sleep 1;
      done; exit 1
      "

volumes:
  pgdata:
  s3data:
