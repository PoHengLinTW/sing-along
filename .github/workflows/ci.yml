name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: singalong
          POSTGRES_PASSWORD: singalong
          POSTGRES_DB: singalong
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U singalong" --health-interval 2s --health-timeout 3s --health-retries 20
      s3:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: minioadmin
          RUSTFS_SECRET_KEY: minioadmin
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
