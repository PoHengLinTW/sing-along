name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: singalong
          POSTGRES_PASSWORD: singalong
          POSTGRES_DB: singalong
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U singalong" --health-interval 2s --health-timeout 3s --health-retries 20
      s3:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: minioadmin
          RUSTFS_SECRET_KEY: minioadmin
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Playwright against the built app (API serving the web app), Postgres and RustFS, with
  # Chromium's fake microphone. Every user flow of M1-M3 is covered: see tasks/M3.md, M3-10.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: singalong
          POSTGRES_PASSWORD: singalong
          POSTGRES_DB: singalong
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U singalong" --health-interval 2s --health-timeout 3s --health-retries 20
      s3:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: minioadmin
          RUSTFS_SECRET_KEY: minioadmin
          # The browser talks to storage directly from the app's origin.
          RUSTFS_CORS_ALLOWED_ORIGINS: '*'
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sing-along/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # The production image must keep building, stay small, and start as a non-root user.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t sing-along:ci .
      - name: Image is under 300 MB and runs as non-root
        run: |
          size=$(docker image inspect sing-along:ci --format '{{.Size}}')
          echo "image size: $size bytes"
          test "$size" -lt 314572800
          test "$(docker run --rm sing-along:ci id -u)" != "0"
