<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sing-along spike</title>
    <style>
      body { font: 14px system-ui; max-width: 760px; margin: 1rem auto; padding: 0 1rem; }
      .track { border: 1px solid #ccc; border-radius: 6px; padding: .5rem; margin: .5rem 0; }
      .track label { display: inline-block; margin-right: .75rem; }
      input[type=range] { width: 100%; }
      section { margin: 1.25rem 0; }
      pre { background: #f4f4f4; padding: .5rem; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Sing-along spike</h1>
    <p id="env"></p>

    <section>
      <h2>Tracks</h2>
      <input id="files" type="file" accept="audio/*" multiple />
      <div id="tracks"></div>
    </section>

    <section>
      <h2>Transport</h2>
      <button id="play">Play</button>
      <button id="pause">Pause</button>
      <span id="time">0.00 / 0.00</span>
      <input id="seek" type="range" min="0" max="0" step="0.01" value="0" />
    </section>

    <section id="record-section">
      <h2>Mic</h2>
      <button id="enable-mic">Enable mic</button>
      <button id="record">Record (plays mix from playhead)</button>
      <button id="stop-record" disabled>Stop</button>
      <span id="rec-time"></span>
    </section>

    <section>
      <h2>Encode (M0-04)</h2>
      <button id="bench-encode">Encode synthetic 4-min take (benchmark)</button>
      <div id="downloads"></div>
    </section>

    <pre id="log"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
